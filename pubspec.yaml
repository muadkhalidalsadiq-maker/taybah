name: taybah
description: "طيبة للأذكار والصلاة - مواقيت الصلاة، الأذكار، والقرآن الكريم برواية قالون"
publish_to: 'none'
version: 3.0.0+5

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  sqflite: ^2.4.3
  path: ^1.9.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  google_fonts: ^8.2.1
  just_audio: ^0.10.6
  intl: ^0.20.2
  flutter_local_notifications: ^18.0.1
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  http: ^1.2.0
  timezone: ^0.9.4
  flutter_compass: ^0.8.1
  just_audio_background: ^0.0.1-beta.17
  hijri: ^3.0.1
  home_widget: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/images/
    - assets/audio/

  fonts:
    - family: Somar
      fonts:
        - asset: assets/fonts/SomarSans-Light.otf
          weight: 300
        - asset: assets/fonts/SomarSans-Regular.otf
          weight: 400
        - asset: assets/fonts/SomarSans-Medium.otf
          weight: 500
        - asset: assets/fonts/SomarSans-SemiBold.otf
          weight: 600
        - asset: assets/fonts/SomarSans-Bold.otf
          weight: 700
        - asset: assets/fonts/SomarSans-ExtraBold.otf
          weight: 800
